name: Refresh CISA KEV mirror

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and slim the catalogue
        run: python3 .github/scripts/slim_kev.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/kev.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kev.json
          git commit -m "Refresh CISA KEV mirror"
          git push
